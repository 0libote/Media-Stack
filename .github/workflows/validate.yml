name: Validate starter
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        run: python3 -m unittest discover -s tests -v
      - name: Check Compose configurations
        run: python3 tests/check_compose.py
      - name: Check portal JavaScript
        run: node --check portal/links.js
